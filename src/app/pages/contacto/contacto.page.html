<ion-header class="ion-no-border">
  <ion-toolbar mode="md">
    <ion-avatar slot="start" class="header-avatar">
      <img src="../../../assets/img/foto_perfil.jpg" />
    </ion-avatar>
    <ion-title>Kike Portafolio</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button color="light"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div style="text-align: center; margin-bottom: 20px;">
    <h2 style="font-weight: 700; margin-bottom: 5px;">¿Tienes una idea en mente?</h2>
    <p style="color: var(--ion-color-medium); font-size: 14px;">Completa el formulario para iniciar contacto directo.</p>
  </div>

  <div class="form-container" style="background: var(--ion-card-background, #fff); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <div class="input-group" style="margin-bottom: 15px;">
      <label style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 5px; color: var(--ion-color-step-600);">TU NOMBRE</label>
      <input type="text" [(ngModel)]="contacto.nombre" placeholder="Escribe tu nombre" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--ion-color-step-200); background: transparent; color: inherit;">
    </div>

    <div class="input-group" style="margin-bottom: 15px;">
      <label style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 5px; color: var(--ion-color-step-600);">EMAIL</label>
      <input type="email" [(ngModel)]="contacto.email" placeholder="ejemplo@correo.com" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--ion-color-step-200); background: transparent; color: inherit;">
    </div>

    <div class="input-group" style="margin-bottom: 20px;">
      <label style="display: block; font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 5px; color: var(--ion-color-step-600);">MENSAJE</label>
      <textarea rows="4" [(ngModel)]="contacto.mensaje" placeholder="Cuéntame sobre tu idea..." style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--ion-color-step-200); background: transparent; color: inherit; resize: none;"></textarea>
    </div>

    <ion-button expand="block" mode="ios" class="btn-black" (click)="enviarFormulario()">
      Enviar Mensaje <ion-icon name="send-outline" slot="end"></ion-icon>
    </ion-button>
  </div>

  <!-- PANEL DE HISTORIAL LOCAL DE INTERACCIÓN (Fase de evaluación del profesor) -->
  <div style="margin-top: 30px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 1px; color: var(--ion-color-step-500);">BANDEJA DE SALIDA (LOCAL)</span>
      <ion-button *ngIf="historialMensajes.length > 0" fill="clear" color="danger" size="small" (click)="borrarHistorial()">
        Limpiar <ion-icon name="trash-outline" slot="end"></ion-icon>
      </ion-button>
    </div>

    <!-- Si no hay mensajes registrados -->
    <div *ngIf="historialMensajes.length === 0" style="text-align: center; padding: 30px; border: 2px dashed var(--ion-color-step-200); border-radius: 12px; color: var(--ion-color-medium);">
      <ion-icon name="chatbox-ellipses-outline" style="font-size: 32px; margin-bottom: 8px;"></ion-icon>
      <p style="font-size: 13px; margin: 0;">No hay mensajes registrados localmente todavía.</p>
    </div>

    <!-- Lista de Mensajes Enviados simulando una cola asíncrona -->
    <div *ngFor="let item of historialMensajes" style="background: var(--ion-color-step-50, #f9f9f9); border-left: 4px solid var(--ion-color-primary); padding: 12px; border-radius: 0 8px 8px 0; margin-bottom: 12px;">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 4px;">
        <span style="color: var(--ion-color-primary);">De: {{ item.nombre }}</span>
        <span style="color: var(--ion-color-medium); font-weight: 400;">{{ item.fecha }}</span>
      </div>
      <div style="font-size: 11px; color: var(--ion-color-step-600); margin-bottom: 6px;">{{ item.email }}</div>
      <p style="font-size: 13px; margin: 0; font-style: italic; color: var(--ion-color-step-800);">"{{ item.mensaje }}"</p>
    </div>
  </div>

  <div style="height: 30px;"></div>
</ion-content>
